<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">WML Update</title>
  <desc id="desc">A terminal prompt and lowercase wml wordmark</desc>
  <defs>
    <linearGradient id="bg" x1="32" y1="0" x2="480" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C2029"/>
      <stop offset="0.55" stop-color="#15181F"/>
      <stop offset="1" stop-color="#0C0E13"/>
    </linearGradient>
    <linearGradient id="word" x1="230" y1="360" x2="486" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- terminal prompt -->
  <path d="M 68 220 L 136 286 L 68 352" fill="none" stroke="#F8FAFC" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M 148 352 H 214" stroke="#5EEAD4" stroke-width="26" stroke-linecap="square"/>

  <!-- artistic lowercase wordmark: condensed and slanted like a terminal tag -->
  <g transform="translate(222 0) scale(0.72 1)">
    <text x="0" y="352"
          font-family="Avenir Next Condensed, Avenir Next, Helvetica Neue, Arial, sans-serif"
          font-size="210" font-weight="900" font-style="italic"
          letter-spacing="-8" fill="url(#word)" filter="url(#glow)">wml</text>
  </g>
</svg>
