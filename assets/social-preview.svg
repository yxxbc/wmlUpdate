<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070D18"/>
      <stop offset="0.55" stop-color="#0B1628"/>
      <stop offset="1" stop-color="#06111F"/>
    </linearGradient>
    <linearGradient id="accent" x1="700" y1="520" x2="1150" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(222 320) rotate(90) scale(330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="220" cy="320" r="300" fill="url(#glow)" filter="url(#blur)" opacity="0.75"/>

  <!-- faint coordinate/orbit lines -->
  <g opacity="0.12" stroke="#7DD3FC" fill="none">
    <circle cx="220" cy="320" r="266" stroke-width="1"/>
    <circle cx="220" cy="320" r="306" stroke-width="1"/>
    <path d="M 0 80 H 1280 M 0 560 H 1280" stroke-width="1"/>
  </g>

  <image x="76" y="176" width="288" height="288" xlink:href="logo.svg"/>

  <text x="438" y="286" fill="#F8FAFC" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">WML Update</text>
  <text x="442" y="348" fill="#A9BBD3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="400">Cross-platform update infrastructure</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
    <rect x="442" y="400" width="188" height="48" rx="24" fill="#0E2238" stroke="#1E3A5F"/>
    <text x="536" y="431" fill="#67E8F9" text-anchor="middle">GitHub Releases</text>
    <rect x="646" y="400" width="158" height="48" rx="24" fill="#0E2238" stroke="#1E3A5F"/>
    <text x="725" y="431" fill="#6EE7B7" text-anchor="middle">Self-hosted</text>
    <rect x="820" y="400" width="216" height="48" rx="24" fill="#0E2238" stroke="#1E3A5F"/>
    <text x="928" y="431" fill="#93C5FD" text-anchor="middle">Ed25519 signed</text>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#64748B">
    <text x="442" y="514">Windows</text>
    <circle cx="548" cy="507" r="3" fill="#334155"/>
    <text x="566" y="514">macOS</text>
    <circle cx="656" cy="507" r="3" fill="#334155"/>
    <text x="674" y="514">Linux</text>
    <circle cx="742" cy="507" r="3" fill="#334155"/>
    <text x="760" y="514">Any language</text>
  </g>

  <!-- accent corner -->
  <path d="M 1120 0 H 1280 V 160" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
</svg>
