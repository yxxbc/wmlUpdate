version: 2

project_name: wml-update

before:
  hooks:
    - go mod tidy

builds:
  - id: wml-update
    main: ./cmd/wml-update
    binary: wml-update
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/yxxbc/wmlUpdate/internal/buildinfo.Version={{ .Version }}
      - -X github.com/yxxbc/wmlUpdate/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/yxxbc/wmlUpdate/internal/buildinfo.Date={{ .CommitDate }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - id: packages
    package_name: wml-update
    vendor: WML Update contributors
    homepage: https://github.com/yxxbc/wmlUpdate
    maintainer: WML Update contributors
    description: Cross-platform updater for GitHub Releases and self-hosted manifests
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/wml-update/LICENSE
      - src: README.md
        dst: /usr/share/doc/wml-update/README.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  name_template: "WML Update {{ .Version }}"
