name: Feature request
description: Propose an update-system capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What update or integration problem are you unable to solve today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and rollback impact
      description: How should this behave for untrusted archives, signatures and interrupted installs?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
