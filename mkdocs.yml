site_name: WML Update
site_description: Lightweight Go update library with a release CLI and a sidecar for any language.
site_url: https://yxxbc.github.io/wmlUpdate/
repo_url: https://github.com/yxxbc/wmlUpdate
repo_name: yxxbc/wmlUpdate
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - announce.dismiss

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Go SDK: sdk.md
  - Integration: integration.md
  - Testing: testing.md
  - Configuration: configuration.md
  - Manifests: manifest.md
  - GitHub Releases: github-releases.md
  - Self-hosting: self-hosting.md
  - Security: security.md
  - Release signing: release-signing.md
  - Troubleshooting: troubleshooting.md
  - Architecture:
      - Overview: architecture.md
      - Decisions: adr/index.md
      - 0001 Go static binary: adr/0001-go-static-binary.md
      - 0002 Subprocess and HTTP: adr/0002-subprocess-json-and-http.md
      - 0003 Transactional install: adr/0003-transactional-install.md
      - 0004 Supply-chain verification: adr/0004-supply-chain-verification.md
      - 0005 SDK-first API: adr/0005-sdk-first-public-api.md
      - 0006 Source chains: adr/0006-source-chains.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yxxbc/wmlUpdate
      name: WML Update on GitHub

copyright: Copyright &copy; 2026 WML Update contributors &middot; Apache-2.0
